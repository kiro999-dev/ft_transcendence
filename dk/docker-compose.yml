# Run from the dk/ folder:  make   (or: docker compose up --build -d)
# Needs only Docker on the host — no Node, no npm, no Postgres.
# All paths below are relative to this dk/ folder.

name: ft_transcendence

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17}
    container_name: estateflow-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../apps/backend
      dockerfile: ../../dk/backend.Dockerfile   # relative to the context
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    container_name: estateflow-backend
    env_file: .env
    environment:
      # Inside Docker the database host is the service name "postgres", not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: 3000
      # Check files for changes every few ms (needed when Docker can't see file events)
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    ports:
      - "3000:3000"
    volumes:
      - ../apps/backend:/app                     # your code: edit on the host, container reloads
      - backend_node_modules:/app/node_modules   # packages stay inside Docker
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: ../../dk/frontend.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    container_name: estateflow-frontend
    environment:
      # Check files for changes every 300 ms (needed when Docker can't see file events)
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      - "5173:5173"
    volumes:
      - ../apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules: